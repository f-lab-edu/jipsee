<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 700" role="img" aria-label="S3 챗봇: 조회 결과와 조문으로만 답하고 판단은 하지 않음" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">S3 챗봇: 조회 결과와 조문으로만 답하고 판단은 하지 않음</text><text x="56" y="64" font-size="13" font-weight="600" fill="#191f28">기본</text><text x="404" y="64" font-size="13" font-weight="600" fill="#191f28">판단 요청, 일일 한도</text><g><rect x="56" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="56" x2="356" y1="120" y2="120" stroke="#d1d6db"></line><text x="72" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 챗봇</text><rect x="72" y="136" width="104" height="22" rx="11" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></rect><text x="124" y="151" font-size="11" text-anchor="middle" fill="#191f28">○○빌라 기준</text><rect x="112" y="172" width="228" height="32" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="328" y="192" font-size="11.5" text-anchor="end" fill="#191f28">○○빌라 주변 전세 거래 알려줘</text><rect x="72" y="216" width="244" height="112" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="84" y="238" font-size="11.5" fill="#191f28">반경 500m, 최근 12개월 기준</text><text x="84" y="254" font-size="11.5" fill="#191f28">신규 전세 14건입니다.</text><text x="84" y="270" font-size="11.5" fill="#191f28">○○빌라 24,000 (2026.07) 외 13건</text><text x="84" y="290" font-size="10.5" fill="#6b7684">출처: 국토교통부 실거래가</text><text x="84" y="308" font-size="10.5" fill="#6b7684">2026년 9월 기준</text><text x="304" y="308" font-size="10.5" text-anchor="end" fill="#3182f6">○○빌라 상세 ›</text><rect x="112" y="340" width="228" height="32" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="328" y="360" font-size="11.5" text-anchor="end" fill="#191f28">계약갱신요구권은 언제 쓰나요?</text><rect x="72" y="384" width="244" height="96" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="84" y="406" font-size="11.5" fill="#191f28">계약 만료 6개월 전부터</text><text x="84" y="422" font-size="11.5" fill="#191f28">2개월 전까지 행사할 수 있습니다.</text><text x="84" y="442" font-size="10.5" fill="#6b7684">주택임대차보호법 제6조의3</text><text x="84" y="460" font-size="10.5" fill="#6b7684">법제처, 2026년 9월 기준</text><rect x="72" y="616" width="216" height="44" rx="22" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="88" y="643" font-size="12" fill="#6b7684">메시지 입력</text><rect x="296" y="616" width="44" height="44" rx="22" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></rect><text x="318" y="643" font-size="14" font-weight="600" text-anchor="middle" fill="#191f28">↑</text></g><circle cx="38" cy="98" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="102" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">1</text><circle cx="38" cy="147" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="151" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">2</text><circle cx="38" cy="276" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="280" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">3</text><circle cx="38" cy="638" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="642" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">4</text><g><rect x="404" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="404" x2="704" y1="120" y2="120" stroke="#d1d6db"></line><text x="420" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 챗봇</text><rect x="460" y="136" width="228" height="32" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="676" y="156" font-size="11.5" text-anchor="end" fill="#191f28">이 집 계약해도 괜찮을까요?</text><rect x="420" y="180" width="244" height="60" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="202" font-size="11.5" fill="#191f28">계약 여부는 판단하지 않습니다.</text><text x="432" y="218" font-size="11.5" fill="#191f28">건물 정보, 거래 기록은 안내합니다.</text><rect x="460" y="252" width="228" height="32" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="676" y="272" font-size="11.5" text-anchor="end" fill="#191f28">보증금 소송 이길 수 있나요?</text><rect x="420" y="296" width="244" height="78" rx="14" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="318" font-size="11.5" fill="#191f28">개별 사건은 판단하지 않습니다.</text><text x="432" y="334" font-size="11.5" fill="#191f28">전문가 상담이 필요합니다.</text><text x="432" y="354" font-size="10.5" fill="#6b7684">관련 조문: 주택임대차보호법 제3조의2</text><rect x="420" y="600" width="268" height="60" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.25"></rect><text x="434" y="625" font-size="12" font-weight="600" fill="#191f28">오늘 질문 한도를 모두 사용했습니다</text><text x="434" y="644" font-size="11.5" fill="#191f28">내일 다시 이용할 수 있습니다</text></g></svg>
