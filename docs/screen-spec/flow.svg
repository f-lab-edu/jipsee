<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 320" role="img" aria-label="검색에서 시작하고 챗봇만 로그인 필요" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95a1"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">검색에서 시작하고 챗봇만 로그인 필요</text><g fill="none" stroke="#8b95a1" stroke-width="1.25"><path d="M200 116H298" marker-end="url(#flow-arrow)"></path><path d="M460 116H558" marker-end="url(#flow-arrow)"></path><path d="M560 136H462" marker-end="url(#flow-arrow)"></path><path d="M120 96V76H640V94" marker-end="url(#flow-arrow)"></path><path d="M620 152V206" marker-end="url(#flow-arrow)"></path><path d="M660 208V154" marker-end="url(#flow-arrow)"></path><path d="M120 152V206" marker-end="url(#flow-arrow)"></path></g><g><rect x="40" y="96" width="160" height="56" rx="8" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="2"></rect><text x="120" y="120" text-anchor="middle" font-weight="600" fill="#191f28">S1 검색</text><text x="120" y="138" text-anchor="middle" font-size="11.5" fill="#6b7684">첫 화면</text></g><g><rect x="300" y="96" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8b95a1" stroke-width="1.25"></rect><text x="380" y="120" text-anchor="middle" font-weight="600" fill="#191f28">S2 건물 상세</text><text x="380" y="138" text-anchor="middle" font-size="11.5" fill="#6b7684">거래 이력, 주변 거래</text></g><g><rect x="560" y="96" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8b95a1" stroke-width="1.25"></rect><text x="640" y="120" text-anchor="middle" font-weight="600" fill="#191f28">S3 챗봇</text><text x="640" y="138" text-anchor="middle" font-size="11.5" fill="#6b7684">로그인 필요</text></g><g><rect x="560" y="208" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8b95a1" stroke-width="1.25"></rect><text x="640" y="232" text-anchor="middle" font-weight="600" fill="#191f28">S4 로그인</text><text x="640" y="250" text-anchor="middle" font-size="11.5" fill="#6b7684">구글, 카카오, 네이버</text></g><g><rect x="40" y="208" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8b95a1" stroke-width="1.25"></rect><text x="120" y="232" text-anchor="middle" font-weight="600" fill="#191f28">S5 내 정보</text><text x="120" y="250" text-anchor="middle" font-size="11.5" fill="#6b7684">로그아웃, 탈퇴</text></g><text x="249" y="108" text-anchor="middle" font-size="11.5" fill="#6b7684">결과 선택</text><text x="509" y="108" text-anchor="middle" font-size="11.5" fill="#6b7684">질문하기</text><text x="509" y="152" text-anchor="middle" font-size="11.5" fill="#6b7684">건물 링크</text><text x="380" y="70" text-anchor="middle" font-size="11.5" fill="#6b7684">하단 입력창에서 질문</text><text x="612" y="184" text-anchor="end" font-size="11.5" fill="#6b7684">비로그인</text><text x="668" y="184" font-size="11.5" fill="#6b7684">로그인 후 복귀</text><text x="128" y="184" font-size="11.5" fill="#6b7684">헤더 프로필</text><text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#6b7684">S4는 모든 화면의 헤더 로그인 버튼으로도 진입</text></svg>
