<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 340" role="img" aria-label="주변 전세 거래: 3건 미만이면 조건을 넓히도록 안내" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95a1"></path></marker></defs><g fill="none" stroke="#8b95a1" stroke-width="1.25"><path d="M185 100H234" marker-end="url(#f-arrow)"></path><path d="M364 100H393" marker-end="url(#f-arrow)"></path><path d="M300 134V186" marker-end="url(#f-arrow)"></path><path d="M395 210H573" marker-end="url(#f-arrow)"></path><path d="M565 100H650V180" marker-end="url(#f-arrow)"></path><path d="M650 238V280H100V130" marker-end="url(#f-arrow)"></path></g><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">주변 전세 거래: 3건 미만이면 조건을 넓히도록 안내</text><g><rect x="15.0" y="72.0" width="170" height="56" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="100" y="97" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">기본 조건으로 조회</text><text x="100" y="115" font-size="11" text-anchor="middle" fill="#6b7684">500m, ±10㎡, 12개월</text></g><g><polygon points="236,100 300,66 364,100 300,134" fill="none" stroke="#8b95a1" stroke-width="1.25"></polygon><text x="300" y="104" font-size="12" font-weight="600" text-anchor="middle" fill="#191f28">3건 이상?</text></g><g><rect x="395.0" y="72.0" width="170" height="56" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="480" y="97" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">목록, 건수, 기준일</text><text x="480" y="115" font-size="11" text-anchor="middle" fill="#6b7684">원본 필드 그대로</text></g><g><rect x="205.0" y="188.0" width="190" height="44" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.25"></rect><text x="300" y="21