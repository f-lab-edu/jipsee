<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 420" role="img" aria-label="로그인: 실패하면 S4로 돌아오고 성공하면 원래 화면으로 복귀" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b95a1"></path></marker></defs><g fill="none" stroke="#8b95a1" stroke-width="1.25"><path d="M180 100H203" marker-end="url(#f-arrow)"></path><path d="M355 100H378" marker-end="url(#f-arrow)"></path><path d="M520 100H554" marker-end="url(#f-arrow)"></path><path d="M620 134V186" marker-end="url(#f-arrow)"></path><path d="M535 210H280V130" marker-end="url(#f-arrow)"></path><path d="M684 100H728V330H707" marker-end="url(#f-arrow)"></path><path d="M515 330H457" marker-end="url(#f-arrow)"></path></g><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">로그인: 실패하면 S4로 돌아오고 성공하면 원래 화면으로 복귀</text><g><rect x="20.0" y="72.0" width="160" height="56" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="100" y="97" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">로그인 필요 동작</text><text x="100" y="115" font-size="11" text-anchor="middle" fill="#6b7684">헤더 로그인, 챗봇 진입</text></g><g><rect x="205.0" y="72.0" width="150" height="56" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="280" y="97" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">S4 제공자 선택</text><text x="280" y="115" font-size="11" text-anchor="middle" fill="#6b7684">구글, 카카오, 네이버</text></g><g><rect x="380.0" y="78.0" width="140" height="44" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="450" y="105" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">제공자 인증</text></g><g><polygon points="556,100 620,66 684,100 620,134" fill="none" stroke="#8b95a1" stroke-width="1.25"></polygon><text x="620" y="104" font-size="12" font-weight="600" text-anchor="middle" fill="#191f28">성공?</text></g><g><rect x="535.0" y="188.0" width="170" height="44" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.25"></rect><text x="620" y="215" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">실패, 취소 안내</text></g><g><rect x="515.0" y="302.0" width="190" height="56" rx="8" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="610" y="327" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">계정 확인, 없으면 생성</text><text x="610" y="345" font-size="11" text-anchor="middle" fill="#6b7684">로그인 수단별 별도 계정</text></g><g><rect x="265.0" y="302.0" width="190" height="56" rx="8" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="2"></rect><text x="360" y="327" font-size="13" font-weight="600" text-anchor="middle" fill="#191f28">원래 화면 복귀</text><text x="360" y="345" font-size="11" text-anchor="middle" fill="#6b7684">챗봇 진입이었으면 S3</text></g><text x="706" y="92" font-size="11.5" text-anchor="middle" fill="#6b7684">예</text><text x="628" y="164" font-size="11.5" fill="#6b7684">아니오</text><text x="408" y="202" font-size="11.5" text-anchor="middle" fill="#6b7684">다시 시도</text><rect x="24" y="392" width="14" height="12" rx="3" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.5"></rect><text x="44" y="402" font-size="11.5" fill="#6b7684">도착 화면</text><rect x="124" y="392" width="14" height="12" rx="3" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.25"></rect><text x="144" y="402" font-size="11.5" fill="#6b7684">안내 상태</text><rect x="224" y="392" width="14" height="12" rx="3" fill="none" stroke="#8b95a1" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="244" y="402" font-size="11.5" fill="#6b7684">시작</text></svg>
