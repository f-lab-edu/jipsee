<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 700" role="img" aria-label="S4 로그인은 3개 수단, S5 내 정보에서 로그아웃과 탈퇴" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">S4 로그인은 3개 수단, S5 내 정보에서 로그아웃과 탈퇴</text><text x="56" y="64" font-size="13" font-weight="600" fill="#191f28">S4 로그인</text><text x="404" y="64" font-size="13" font-weight="600" fill="#191f28">S5 내 정보</text><g><rect x="56" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="56" x2="356" y1="120" y2="120" stroke="#d1d6db"></line><text x="72" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 로그인</text><text x="206.0" y="196" font-size="22" font-weight="600" text-anchor="middle" fill="#191f28">Jipsee</text><text x="206.0" y="224" font-size="12" text-anchor="middle" fill="#6b7684">로그인하고 챗봇을 이용하세요</text><rect x="72" y="268" width="268" height="44" rx="22" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="206.0" y="295" font-size="12.5" font-weight="600" text-anchor="middle" fill="#191f28">구글로 계속하기</text><rect x="72" y="324" width="268" height="44" rx="22" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="206.0" y="351" font-size="12.5" font-weight="600" text-anchor="middle" fill="#191f28">카카오로 계속하기</text><rect x="72" y="380" width="268" height="44" rx="22" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="206.0" y="407" font-size="12.5" font-weight="600" text-anchor="middle" fill="#191f28">네이버로 계속하기</text><text x="72" y="460" font-size="11" fill="#6b7684">계속하면 이용약관과 개인정보처리방침에</text><text x="72" y="476" font-size="11" fill="#6b7684">동의하게 됩니다</text><text x="72" y="500" font-size="11" fill="#6b7684">챗봇 질문은 외부 LLM으로 전송됩니다</text><text x="72" y="516" font-size="11" fill="#6b7684">개인정보는 일본으로 국외 이전됩니다</text></g><circle cx="38" cy="290" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="294" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">1</text><circle cx="38" cy="476" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="480" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">2</text><g><rect x="404" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="404" x2="704" y1="120" y2="120" stroke="#d1d6db"></line><text x="420" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 내 정보</text><rect x="420" y="136" width="268" height="52" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="156" font-size="11" fill="#6b7684">로그인 수단</text><text x="432" y="175" font-size="12.5" font-weight="600" fill="#191f28">카카오 계정</text><rect x="420" y="204" width="268" height="40" rx="20" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><text x="554.0" y="229" font-size="12.5" text-anchor="middle" fill="#191f28">로그아웃</text><line x1="420" x2="688" y1="304" y2="304" stroke="#d1d6db"></line><text x="424" y="291" font-size="12.5" fill="#191f28">이용약관</text><text x="684" y="291" font-size="13" text-anchor="end" fill="#6b7684">›</text><line x1="420" x2="688" y1="348" y2="348" stroke="#d1d6db"></line><text x="424" y="335" font-size="12.5" fill="#191f28">개인정보처리방침</text><text x="684" y="335" font-size="13" text-anchor="end" fill="#6b7684">›</text><line x1="420" x2="688" y1="392" y2="392" stroke="#d1d6db"></line><text x="424" y="379" font-size="12.5" fill="#191f28">데이터 출처</text><text x="684" y="379" font-size="13" text-anchor="end" fill="#6b7684">›</text><text x="424" y="616" font-size="12.5" fill="#6b7684">회원 탈퇴</text><text x="424" y="636" font-size="11" fill="#6b7684">탈퇴하면 계정과 대화 기록이 삭제됩니다</text></g><circle cx="386" cy="162" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="166" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">1</text><circle cx="386" cy="224" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="228" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">2</text><circle cx="386" cy="334" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">3</text><circle cx="386" cy="612" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="616" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">4</text></svg>
