<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 700" role="img" aria-label="S6 정책: 처리방침, 약관은 목차와 본문, 데이터 출처는 출처별 카드" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#191f28">S6 정책: 처리방침, 약관은 목차와 본문, 데이터 출처는 출처별 카드</text><text x="56" y="64" font-size="13" font-weight="600" fill="#191f28">개인정보처리방침 (이용약관 동일)</text><text x="404" y="64" font-size="13" font-weight="600" fill="#191f28">데이터 출처</text><g><rect x="56" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="56" x2="356" y1="120" y2="120" stroke="#d1d6db"></line><text x="72" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 개인정보처리방침</text><text x="72" y="144" font-size="11.5" fill="#6b7684">시행일 2026.○○.○○</text><text x="340" y="144" font-size="11.5" text-anchor="end" fill="#3182f6">이전 버전 ›</text><rect x="72" y="160" width="268" height="168" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="84" y="182" font-size="11.5" fill="#191f28">1. 처리 목적</text><text x="84" y="201" font-size="11.5" fill="#191f28">2. 처리 항목</text><text x="84" y="220" font-size="11.5" fill="#191f28">3. 보유 기간, 파기</text><text x="84" y="239" font-size="11.5" fill="#191f28">4. 처리 위탁</text><text x="84" y="258" font-size="11.5" fill="#191f28">5. 국외 이전</text><text x="84" y="277" font-size="11.5" fill="#191f28">6. 쿠키</text><text x="84" y="296" font-size="11.5" fill="#191f28">7. 정보주체 권리</text><text x="84" y="315" font-size="11.5" fill="#191f28">8. 보호책임자</text><text x="72" y="360" font-size="13" font-weight="600" fill="#191f28">5. 국외 이전</text><text x="72" y="386" font-size="11.5" fill="#191f28">이전받는 자: Oracle (연락처)</text><text x="72" y="406" font-size="11.5" fill="#191f28">이전 국가: 일본</text><text x="72" y="426" font-size="11.5" fill="#191f28">항목: 계정, 대화 기록, 접속 기록</text><text x="72" y="446" font-size="11.5" fill="#191f28">시기, 방법: 서비스 이용 시 네트워크 전송</text><text x="72" y="466" font-size="11.5" fill="#191f28">목적, 기간: 서버 보관, 탈퇴 시까지</text><text x="72" y="486" font-size="11.5" fill="#191f28">거부 방법: 탈퇴. 거부 시 로그인 불가</text></g><circle cx="38" cy="98" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="102" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">1</text><circle cx="38" cy="140" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="144" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">2</text><circle cx="38" cy="236" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="240" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">3</text><circle cx="38" cy="406" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="38" y="410" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">4</text><g><rect x="404" y="76" width="300" height="600" rx="18" fill="none" stroke="#8b95a1" stroke-width="1.25"></rect><line x1="404" x2="704" y1="120" y2="120" stroke="#d1d6db"></line><text x="420" y="104" font-size="13" font-weight="600" fill="#191f28">‹ 데이터 출처</text><rect x="420" y="136" width="268" height="70" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="158" font-size="12.5" font-weight="600" fill="#191f28">연립다세대 전월세 실거래</text><text x="432" y="176" font-size="11" fill="#6b7684">국토교통부, 공공데이터포털</text><text x="432" y="193" font-size="11" fill="#6b7684">매일 갱신, 2026.09 기준</text><text x="676" y="193" font-size="11" text-anchor="end" fill="#3182f6">원본 ›</text><rect x="420" y="216" width="268" height="70" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="238" font-size="12.5" font-weight="600" fill="#191f28">연립다세대 매매 실거래</text><text x="432" y="256" font-size="11" fill="#6b7684">국토교통부, 공공데이터포털</text><text x="432" y="273" font-size="11" fill="#6b7684">매일 갱신, 2026.09 기준</text><text x="676" y="273" font-size="11" text-anchor="end" fill="#3182f6">원본 ›</text><rect x="420" y="296" width="268" height="70" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="318" font-size="12.5" font-weight="600" fill="#191f28">건축물대장 표제부</text><text x="432" y="336" font-size="11" fill="#6b7684">국토교통부 건축HUB</text><text x="432" y="353" font-size="11" fill="#6b7684">매월 갱신, 2026.09 기준</text><text x="676" y="353" font-size="11" text-anchor="end" fill="#3182f6">원본 ›</text><rect x="420" y="376" width="268" height="70" rx="8" fill="none" stroke="#d1d6db" stroke-width="1.25"></rect><text x="432" y="398" font-size="12.5" font-weight="600" fill="#191f28">법령, 판례</text><text x="432" y="416" font-size="11" fill="#6b7684">법제처</text><text x="432" y="433" font-size="11" fill="#6b7684">개정 시 갱신</text><text x="676" y="433" font-size="11" text-anchor="end" fill="#3182f6">원본 ›</text><rect x="420" y="464" width="268" height="64" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.25"></rect><text x="432" y="486" font-size="11.5" fill="#191f28">전월세는 확정일자 기반이라 일부 누락</text><text x="432" y="504" font-size="11.5" fill="#191f28">최근 1~2개월 거래는 계속 늘어남</text><text x="432" y="520" font-size="11" fill="#191f28">공시가격은 공시가격알리미 링크만 제공</text></g><circle cx="386" cy="171" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="175" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">1</text><circle cx="386" cy="496" r="9" fill="#3182f6" fill-opacity="0.12" stroke="#3182f6" stroke-width="1.25"></circle><text x="386" y="500" font-size="11" font-weight="600" text-anchor="middle" fill="#191f28">2</text></svg>
