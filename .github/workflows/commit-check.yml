name: commit-check

on:
  pull_request:

jobs:
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 커밋 메시지 컨벤션 검사
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git log --no-merges --format=%s "origin/$BASE_REF"..HEAD | bash scripts/check-commit-subject.sh
