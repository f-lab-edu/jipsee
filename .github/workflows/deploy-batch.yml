name: deploy-batch

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-batch.yml"
  workflow_dispatch:

concurrency:
  group: deploy-batch
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.repository == 'f-lab-edu/jipsee'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ghcr 로그인
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드와 푸시
        run: |
          docker build -t "ghcr.io/f-lab-edu/jipsee-backend:$GITHUB_SHA" backend
          docker push "ghcr.io/f-lab-edu/jipsee-backend:$GITHUB_SHA"

  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-24.04-arm
    # 서버에는 읽기 전용 토큰만 전달
    permissions:
      contents: read
      packages: read
    steps:
      - name: 서버 배포
        run: |
          key_file="$RUNNER_TEMP/deploy_key"
          known_hosts_file="$RUNNER_TEMP/known_hosts"
          output_file="$RUNNER_TEMP/deploy-output.log"

          (umask 077 && printf '%s\n' "$VM_SSH_KEY" > "$key_file")
          printf '%s\n' "$VM_SSH_HOST_KEY" > "$known_hosts_file"

          set +e
          printf '%s\n%s\n%s\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_TOKEN" |
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" -o BatchMode=yes \
              -i "$key_file" "$VM_USER@$VM_HOST" 2>&1 |
            tee "$output_file"
          ssh_status=${PIPESTATUS[1]}
          set -e

          result=$(grep '^RESULT ' "$output_file" | tail -n 1 || true)
          if [ -n "$result" ]; then
            echo "$result" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ssh_status" -ne 0 ]; then
            echo "::error::ssh 종료 코드 $ssh_status"
            exit 1
          fi
          if [ -z "$result" ]; then
            echo "::error::RESULT 줄이 없음"
            exit 1
          fi
          if [ "$result" != "RESULT DEPLOYED" ]; then
            echo "::error::배포 실패, $result"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_HOST_KEY: ${{ secrets.VM_SSH_HOST_KEY }}
      - name: SSH 키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
