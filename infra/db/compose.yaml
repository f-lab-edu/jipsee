name: jipsee-db

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *logging
    mem_limit: 4g
    environment:
      MYSQL_DATABASE: jipsee
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --skip-log-bin
      # 데이터와 인덱스 약 1.3GB가 메모리에 들어가도록 버퍼 풀 3GB, 컨테이너 메모리 4GB
      - --innodb-buffer-pool-size=3G
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:12.11.0
    profiles: [schema]
    mem_limit: 512m
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/jipsee
      FLYWAY_USER: ${DB_USERNAME:?DB_USERNAME is required}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./schema:/flyway/sql:ro
    restart: "no"

# 앱 컴포즈가 이 이름으로 붙음
networks:
  default:
    name: jipsee-db

# 앱 컴포즈로 만들어 둔 기존 볼륨에 연결
volumes:
  mysql-data:
    external: true
    name: jipsee_mysql-data
