# Grafana 접속용 nginx 사이트 설정
# 서버 /etc/nginx/sites-available에 복사 후 sites-enabled에 링크, JIPSEE_DOMAIN은 실제 도메인으로 교체
# 사이트 활성화 전 certbot certonly --nginx -d grafana.JIPSEE_DOMAIN으로 인증서 발급
# 갱신은 certbot.timer가 nginx 방식으로 처리, 80 블록의 리다이렉트와 무관

# Grafana Live 웹소켓 업그레이드용, 다른 사이트 설정과 변수명이 겹치지 않도록 접두사 사용
map $http_upgrade $jipsee_grafana_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.JIPSEE_DOMAIN;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.JIPSEE_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/grafana.JIPSEE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.JIPSEE_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live 웹소켓
    location /api/live/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jipsee_grafana_connection_upgrade;
        proxy_set_header Host $host;
    }
}
