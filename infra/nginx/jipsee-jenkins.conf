# Jenkins 접속용 nginx 사이트 설정
# 서버 /etc/nginx/sites-available에 복사 후 sites-enabled에 링크, JIPSEE_DOMAIN은 실제 도메인으로 교체
# HTTPS는 certbot --nginx -d jenkins.JIPSEE_DOMAIN 실행 시 443 블록과 리다이렉트 자동 추가
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.JIPSEE_DOMAIN;

    # Prometheus 지표는 외부 비공개
    location /prometheus/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_redirect default;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 빌드 로그 스트리밍 응답 버퍼링 해제
        proxy_buffering off;
        proxy_request_buffering off;

        # 아티팩트 업로드 크기 제한 해제
        client_max_body_size 0;
        proxy_read_timeout 90s;
    }
}
