# Jenkins 접속용 nginx 사이트 설정
# 서버 /etc/nginx/sites-available에 복사 후 sites-enabled에 링크
# 사이트 활성화 전 certbot certonly --nginx -d jenkins.jipsee.link으로 인증서 발급
# 갱신은 certbot.timer가 nginx 방식으로 처리, 80 블록의 리다이렉트와 무관
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.jipsee.link;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jenkins.jipsee.link;

    ssl_certificate /etc/letsencrypt/live/jenkins.jipsee.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.jipsee.link/privkey.pem;

    # Prometheus 지표는 외부 비공개
    location /prometheus/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_redirect default;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 빌드 로그 스트리밍 응답 버퍼링 해제
        proxy_buffering off;
        proxy_request_buffering off;

        # 아티팩트 업로드 크기 제한 해제
        client_max_body_size 0;
        proxy_read_timeout 90s;
    }
}
