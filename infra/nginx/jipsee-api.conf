# api 접속용 nginx 사이트 설정
# 서버 /etc/nginx/sites-available에 복사 후 sites-enabled에 링크
# 사이트 활성화 전 certbot certonly --nginx -d api.jipsee.link으로 인증서 발급
# 갱신은 certbot.timer가 nginx 방식으로 처리, 80 블록의 리다이렉트와 무관

server {
    listen 80;
    listen [::]:80;
    server_name api.jipsee.link;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jipsee.link;

    ssl_certificate /etc/letsencrypt/live/api.jipsee.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jipsee.link/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator {
        return 404;
    }
}
