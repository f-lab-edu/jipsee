name: jipsee

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: jipsee-backend:latest
    pull_policy: never
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/jipsee
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:?DATA_GO_KR_KEY is required}
    networks:
      - db
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

networks:
  db:
    external: true
    name: jipsee-db
