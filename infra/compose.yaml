name: jipsee

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ghcr.io/f-lab-edu/jipsee-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/jipsee
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LOGGING_FILE_NAME: /app/logs/jipsee.log
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: "7"
    volumes:
      - /var/log/jipsee/app:/app/logs
    networks:
      - db
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:8082:8081"
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging

  fluent-bit:
    image: fluent/fluent-bit:5.2.0
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/log/jipsee/app:/logs:ro
      - /var/lib/jipsee/fluent-bit:/state
    networks:
      - db
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

networks:
  db:
    external: true
    name: jipsee-db
