[SERVICE]
    Flush       5
    Log_Level   info

[INPUT]
    Name            tail
    Tag             app
    Path            /logs/jipsee.log
    DB              /state/tail.db
    Read_from_Head  On

[OUTPUT]
    Name             s3
    Match            app
    bucket           jipsee-logs
    region           ap-osaka-1
    endpoint         ${LOGS_S3_ENDPOINT}
    use_put_object   On
    compression      gzip
    total_file_size  10M
    upload_timeout   10m
    s3_key_format    /app/%Y/%m/%d/%H%M%S-$UUID.gz
    store_dir        /state/s3
    store_dir_limit_size 500M
    quarantine_dir_limit_size 100M
    Retry_Limit      1000000
