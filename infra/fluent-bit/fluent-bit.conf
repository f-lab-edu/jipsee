[SERVICE]
    Flush       5
    Log_Level   info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port   2020
    Parsers_File parsers.conf
    storage.path /state/storage
    storage.max_chunks_up 32

[INPUT]
    Name            tail
    Tag             app
    Path            /logs/jipsee.log
    DB              /state/tail.db
    Read_from_Head  On
    Mem_Buf_Limit   16MB
    multiline.parser spring_multiline
    storage.type    filesystem

# 수준과 로그 시각 추출. 로그 시각은 레코드 시각이 되어 Loki 기록 시각으로 사용
[FILTER]
    Name         parser
    Match        app
    Key_Name     log
    Parser       spring_log
    Preserve_Key On
    Reserve_Data On

# 패턴에 맞지 않는 줄은 level=UNKNOWN
[FILTER]
    Name      modify
    Match     app
    Condition Key_does_not_exist level
    Add       level UNKNOWN

# 레이블은 job, level 두 개만 사용 (알림 쿼리 {job="jipsee-app", level="ERROR"})
[OUTPUT]
    Name             loki
    Match            app
    Host             loki
    Port             3100
    Labels           job=jipsee-app
    Label_Keys       $level
    Remove_Keys      level,time
    Line_Format      json
    Drop_Single_Key  raw
    Retry_Limit      10
    storage.total_limit_size 200M
