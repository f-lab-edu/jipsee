services:
  mysql:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: jipsee
      MYSQL_USER: jipsee
      MYSQL_PASSWORD: jipsee
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ujipsee", "-pjipsee"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
