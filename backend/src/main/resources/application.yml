server:
  port: 8080
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jipsee}
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true
    username: ${DB_USERNAME:jipsee}
    password: ${DB_PASSWORD:jipsee}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jipsee:
  collect:
    api:
      base-url: https://apis.data.go.kr/1613000
      service-key: ${DATA_GO_KR_KEY}
    # 값을 바꾸면 초기 적재를 처음부터 다시 실행함
    initial-load-end-month: 2026-10