# 테스트 메서드는 한글 이름 사용
sonar.issue.ignore.multicriteria=testMethodName,testFixturesMethodName
sonar.issue.ignore.multicriteria.testMethodName.ruleKey=java:S100
sonar.issue.ignore.multicriteria.testMethodName.resourceKey=backend/**/src/test/**/*.java
sonar.issue.ignore.multicriteria.testFixturesMethodName.ruleKey=java:S100
sonar.issue.ignore.multicriteria.testFixturesMethodName.resourceKey=backend/**/src/testFixtures/**/*.java

# 테스트 코드는 중복 검사에서 제외
sonar.cpd.exclusions=backend/**/src/test/**,backend/**/src/testFixtures/**
