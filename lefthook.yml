pre-commit:
  parallel: true
  commands:
    biome:
      root: frontend/
      glob: "*.{js,jsx,mjs,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
    boundaries:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: pnpm lint:boundaries

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -n1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): .+' || { echo 'type: 제목 형식 필요'; exit 1; }
